<!-- Fixed-header controls -->
<div class="header-controls">
    <form class="hero-search" role="search" aria-label="Sözlük arama" onsubmit="return false">
    <div class="searchbar">
      <input id="search" type="search" placeholder="{{ page.hero_placeholder | default: 'Ara…' }}" autocomplete="off" aria-expanded="false" aria-controls="results">
      <button id="random-word" type="button">{{ page.hero_button | default: '🎲 Rastgele' }}</button>
    </div>
    <ul id="results" class="autocomplete" role="listbox" aria-label="Öneriler"></ul>
  </form>
</div>
